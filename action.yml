name: "Claude AutoFix"
description: "Automatically analyses and fixes failing tests using Claude AI (Python/pytest, JS/TS with Vitest or Jest)"

branding:
  icon: "cpu"
  color: "orange"

inputs:
  anthropic-api-key:
    description: "Anthropic API key (ANTHROPIC_API_KEY)"
    required: true
  max-fixes:
    description: "Maximum number of fixes per run"
    required: false
    default: "5"
  python-version:
    description: "Python version to use"
    required: false
    default: "3.11"
  create-pr:
    description: "Automatically create a Pull Request with the fixes (true/false)"
    required: false
    default: "true"
  test-framework:
    description: "Test framework: pytest | vitest | jest"
    required: false
    default: "pytest"
  language:
    description: "Source language: python | typescript | javascript"
    required: false
    default: "python"
  enable-error-log:
    description: "Append failing test info to logs/error_history.jsonl in main (true/false). Does not consume Claude tokens."
    required: false
    default: "false"
  enable-insights:
    description: "Post a Claude-powered insight comment on the PR based on the author's error history (true/false). Requires enable-error-log on previous runs to have data. Consumes Claude tokens."
    required: false
    default: "false"

outputs:
  fixes-applied:
    description: "Number of fixes successfully applied"
    value: ${{ steps.summary.outputs.fixes_applied }}
  pr-url:
    description: "URL of the Pull Request created with the fixes"
    value: ${{ steps.create_pr.outputs.pr_url }}

runs:
  using: "composite"
  steps:

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up Node.js (JS/TS projects)
      if: ${{ inputs.test-framework == 'vitest' || inputs.test-framework == 'jest' }}
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install Python test dependencies
      if: ${{ inputs.test-framework == 'pytest' }}
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-json-report

    - name: Run pytest and generate report
      if: ${{ inputs.test-framework == 'pytest' }} 
      shell: bash
      continue-on-error: true
      run: |
        pytest --json-report || true

    - name: Run Vitest and generate report
      if: ${{ inputs.test-framework == 'vitest' }}
      shell: bash
      continue-on-error: true
      run: |
        npx vitest run --reporter=json --outputFile=.report.json || true

    - name: Run Jest and generate report
      if: ${{ inputs.test-framework == 'jest' }}
      shell: bash
      continue-on-error: true
      run: |
        npx jest --json --outputFile=.report.json || true

    - name: Check for test failures
      id: check
      shell: bash
      run: |
        if [ ! -f ".report.json" ]; then
          echo "failures=0" >> $GITHUB_OUTPUT
          echo "Test report not found."
          exit 0
        fi
        FAILURES=$(python3 -c "
        import json
        data = json.load(open('.report.json'))
        # pytest format: list of tests with 'outcome'
        if 'tests' in data:
            print(sum(1 for t in data.get('tests', []) if t.get('outcome') == 'failed'))
        # vitest/jest format: top-level numFailedTests counter
        else:
            print(data.get('numFailedTests', 0))
        ")
        echo "failures=${FAILURES}" >> $GITHUB_OUTPUT
        echo "Failing tests found: ${FAILURES}"

    - name: Analyse failures with Claude AI
      id: analyse
      if: steps.check.outputs.failures != '0'
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
      run: |
        python ${{ github.action_path }}/ci/claude_report.py \
          --report .report.json \
          --comment-file claude_comment.md \
          --framework ${{ inputs.test-framework }} \
          --language ${{ inputs.language }}

    - name: Post analysis comment on PR
      if: steps.check.outputs.failures != '0' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ github.token }}
        script: |
          const fs = require('fs');
          const commentPath = 'claude_comment.md';
          if (!fs.existsSync(commentPath)) {
            core.info('No analysis comment file found, skipping.');
            return;
          }
          const body = fs.readFileSync(commentPath, 'utf8').trim();
          if (!body) {
            core.info('Analysis comment file is empty, skipping.');
            return;
          }
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body,
          });
          core.info('Claude analysis comment posted to PR.');

    - name: Generate and apply fixes with Claude AI
      id: fix
      if: steps.check.outputs.failures != '0'
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
      run: |
        python ${{ github.action_path }}/ci/claude_fix.py \
          --report .report.json \
          --apply \
          --max-fixes ${{ inputs.max-fixes }} \
          --framework ${{ inputs.test-framework }} \
          --language ${{ inputs.language }}

    - name: Parse failures for error log
      if: inputs.enable-error-log == 'true' && steps.check.outputs.failures != '0'
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}
        BRANCH: ${{ github.head_ref || github.ref_name }}
        FRAMEWORK: ${{ inputs.test-framework }}
        FIX_OUTCOME: ${{ steps.fix.outcome }}
      run: |
        python3 << 'EOF'
        import json, os
        from datetime import datetime, timezone

        try:
            data = json.load(open('.report.json'))
        except Exception:
            print("Could not read .report.json, skipping log.")
            exit(0)

        ts         = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
        pr         = os.environ.get('PR_NUMBER', '')
        author     = os.environ.get('PR_AUTHOR', '')
        branch     = os.environ.get('BRANCH', '')
        framework  = os.environ.get('FRAMEWORK', 'pytest')
        fix_applied = os.environ.get('FIX_OUTCOME', '') == 'success'

        def extract_error(text):
            """Return (error_type, error_msg) from a traceback string."""
            for line in reversed((text or '').splitlines()):
                line = line.strip().lstrip('E').strip()
                if ':' in line:
                    left, right = line.split(':', 1)
                    left = left.strip()
                    if left and left[0].isupper() and ' ' not in left and len(left) < 40:
                        return left, right.strip()[:120]
            return 'Error', ''

        entries = []

        if 'tests' in data:  # pytest
            for t in data.get('tests', []):
                if t.get('outcome') != 'failed':
                    continue
                longrepr = t.get('longrepr', '') or ''
                if isinstance(longrepr, dict):
                    longrepr = longrepr.get('reprcrash', {}).get('message', '') or str(longrepr)
                error_type, error_msg = extract_error(longrepr)
                nodeid    = t.get('nodeid', '')
                test_file = nodeid.split('::')[0] if '::' in nodeid else nodeid
                test_name = '::'.join(nodeid.split('::')[1:]) if '::' in nodeid else nodeid
                entries.append({
                    'ts': ts, 'pr': pr, 'author': author, 'branch': branch,
                    'file': test_file, 'test': test_name,
                    'error_type': error_type, 'error_msg': error_msg,
                    'fix_applied': fix_applied,
                })

        else:  # vitest / jest
            cwd = os.getcwd()
            for suite in data.get('testResults', []):
                for t in suite.get('testResults', []):
                    if t.get('status') != 'failed':
                        continue
                    raw_msg    = (t.get('failureMessages') or [''])[0]
                    error_type, error_msg = extract_error(raw_msg)
                    ancestors  = t.get('ancestorTitles', [])
                    test_name  = ' > '.join(ancestors + [t.get('title', '')])
                    test_file  = suite.get('testFilePath', '').replace(cwd + '/', '')
                    entries.append({
                        'ts': ts, 'pr': pr, 'author': author, 'branch': branch,
                        'file': test_file, 'test': test_name,
                        'error_type': error_type, 'error_msg': error_msg,
                        'fix_applied': fix_applied,
                    })

        with open('claude-log-entries.json', 'w') as f:
            json.dump(entries, f)

        print(f"Prepared {len(entries)} log entries.")
        EOF

    - name: Append error log to repository
      if: inputs.enable-error-log == 'true' && steps.check.outputs.failures != '0'
      uses: actions/github-script@v7
      with:
        github-token: ${{ github.token }}
        script: |
          const fs = require('fs');

          if (!fs.existsSync('claude-log-entries.json')) {
            core.info('No log entries file found, skipping.');
            return;
          }

          const entries = JSON.parse(fs.readFileSync('claude-log-entries.json', 'utf8'));
          if (!entries.length) {
            core.info('No log entries to write.');
            return;
          }

          const newLines = entries.map(e => JSON.stringify(e)).join('\n');
          const logPath  = 'logs/error_history.jsonl';
          const owner    = context.repo.owner;
          const repo     = context.repo.repo;

          // Fetch existing file from main (if it exists)
          let sha = undefined;
          let existing = '';
          try {
            const { data } = await github.rest.repos.getContent({ owner, repo, path: logPath, ref: 'main' });
            sha      = data.sha;
            existing = Buffer.from(data.content, 'base64').toString('utf8').trimEnd();
          } catch (e) {
            core.info('Log file does not exist yet — will create it.');
          }

          const updated = existing ? existing + '\n' + newLines : newLines;
          const prRef   = entries[0]?.pr || 'unknown';

          await github.rest.repos.createOrUpdateFileContents({
            owner, repo,
            path: logPath,
            message: `log: record ${entries.length} test failure(s) from PR #${prRef}`,
            content: Buffer.from(updated + '\n').toString('base64'),
            branch: 'main',
            ...(sha ? { sha } : {}),
          });

          core.info(`Error log updated: ${entries.length} new entries written to ${logPath}`);

    - name: Generate insights with Claude
      id: insights
      if: inputs.enable-insights == 'true' && steps.check.outputs.failures != '0' && github.event_name == 'pull_request'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        REPO_OWNER: ${{ github.repository_owner }}
        REPO_NAME: ${{ github.event.repository.name }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        python3 << 'PYEOF'
        import json, os, urllib.request, urllib.error, base64

        token   = os.environ['GITHUB_TOKEN']
        api_key = os.environ['ANTHROPIC_API_KEY']
        owner   = os.environ['REPO_OWNER']
        repo    = os.environ['REPO_NAME']
        author  = os.environ['PR_AUTHOR']
        pr_num  = os.environ['PR_NUMBER']

        # 1. Fetch log from main
        gh_url = f"https://api.github.com/repos/{owner}/{repo}/contents/logs/error_history.jsonl?ref=main"
        gh_req = urllib.request.Request(gh_url, headers={
            'Authorization': f'token {token}',
            'Accept': 'application/vnd.github.v3+json',
            'User-Agent': 'claude-autofix-action',
        })
        try:
            with urllib.request.urlopen(gh_req) as resp:
                raw     = json.loads(resp.read())
                content = base64.b64decode(raw['content']).decode('utf-8')
        except urllib.error.HTTPError as e:
            print(f"Log file not found (HTTP {e.code}), skipping insights.")
            exit(0)

        all_entries    = [json.loads(l) for l in content.strip().splitlines() if l.strip()]
        author_entries = [e for e in all_entries if e.get('author') == author]
        total          = len(author_entries)

        if total < 3:
            print(f"Not enough data for @{author} ({total} entries, need at least 3). Skipping.")
            exit(0)

        # 2. Build prompt
        recent   = author_entries[-20:]
        log_text = '\n'.join(
            f"- [{e['ts'][:10]}] {e['error_type']}: {e['error_msg']} | file: {e['file']} | fixed: {e['fix_applied']}"
            for e in recent
        )

        prompt  = "You are a coding mentor reviewing a developer's CI error history.\n"
        prompt += "Be specific, encouraging, and concise.\n\n"
        prompt += f"Developer: @{author}\n"
        prompt += f"Total recorded failures: {total}\n\n"
        prompt += "Recent failures (oldest to newest):\n"
        prompt += log_text + "\n\n"
        prompt += "Write a short insight comment. Rules:\n"
        prompt += "- Identify 1 or 2 clear patterns (recurring error_type, same file, same area of code)\n"
        prompt += "- Give one concrete, actionable tip per pattern — reference actual values from the log\n"
        prompt += "- If fix_applied is often false, mention that the auto-fix struggled and why that might be\n"
        prompt += "- Maximum 6 lines. No greetings. No generic advice. Plain text only."

        # 3. Call Claude (Haiku — fast and cheap for this task)
        payload = json.dumps({
            "model": "claude-3-5-haiku-20241022",
            "max_tokens": 300,
            "messages": [{"role": "user", "content": prompt}]
        }).encode()

        cl_req = urllib.request.Request(
            "https://api.anthropic.com/v1/messages",
            data=payload,
            headers={
                "x-api-key": api_key,
                "anthropic-version": "2023-06-01",
                "content-type": "application/json",
            }
        )
        try:
            with urllib.request.urlopen(cl_req) as resp:
                result       = json.loads(resp.read())
                insight_text = result['content'][0]['text'].strip()
        except Exception as e:
            print(f"Claude API error: {e}. Skipping insights.")
            exit(0)

        # 4. Write comment file
        body  = f"## 🧠 Claude Insights — @{author}\n\n"
        body += f"**{total} errors on record**\n\n"
        body += insight_text
        body += "\n\n---\n*Based on `logs/error_history.jsonl`. Needs at least 3 recorded failures to appear.*"

        with open('claude-insights.md', 'w') as f:
            f.write(body)

        print(f"Insights generated for @{author} ({total} entries analysed).")
        PYEOF

    - name: Post insights comment on PR
      if: inputs.enable-insights == 'true' && steps.check.outputs.failures != '0' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ github.token }}
        script: |
          const fs = require('fs');
          if (!fs.existsSync('claude-insights.md')) {
            core.info('No insights file — not enough data or an error occurred. Skipping.');
            return;
          }
          const body = fs.readFileSync('claude-insights.md', 'utf8').trim();
          if (!body) return;
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body,
          });
          core.info('Insights comment posted to PR.');

    - name: Check for generated changes
      id: changes
      shell: bash
      run: |
        if git diff --quiet; then
          echo "has_changes=false" >> $GITHUB_OUTPUT
        else
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "Changes detected:"
          git diff --name-only
        fi

    - name: Configure git
      if: steps.changes.outputs.has_changes == 'true'
      shell: bash
      run: |
        git config user.name "Claude AutoFix Bot"
        git config user.email "claude-autofix@users.noreply.github.com"

    - name: Create fix branch and commit
      id: commit
      if: steps.changes.outputs.has_changes == 'true'
      shell: bash
      run: |
        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        BRANCH="claude-auto-fix-${TIMESTAMP}"
        echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
        git checkout -b "${BRANCH}"
        git add -u
        git commit -m "fix: apply Claude AI automated fixes for failing tests"
        git push origin "${BRANCH}"

    - name: Create Pull Request with fixes
      id: create_pr
      if: steps.changes.outputs.has_changes == 'true' && inputs.create-pr == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        BASE_BRANCH="${{ github.head_ref || github.ref_name }}"
        PR_URL=$(gh pr create \
          --title "🤖 Claude AutoFix: automated fixes for failing tests" \
          --body "## 🤖 Claude AutoFix

        This PR was automatically created by [Claude AutoFix Action](https://github.com/${{ github.action_repository }}).

        ### What was done
        - Failing tests were analysed by Claude AI
        - Fixes were generated and applied automatically

        ### Next steps
        1. Review the changes carefully
        2. Run the tests locally to confirm the fixes
        3. Merge if everything looks correct

        ### Details
        - Triggered by: \`${{ github.event_name }}\`
        - Source branch: \`${BASE_BRANCH}\`
        - Workflow run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

        ---
        🤖 Generated with [Claude AutoFix](https://github.com/${{ github.action_repository }})" \
          --base "${BASE_BRANCH}" \
          --head "${{ steps.commit.outputs.branch }}")
        echo "pr_url=${PR_URL}" >> $GITHUB_OUTPUT
        echo "Fix PR created: ${PR_URL}"

    - name: Post fix PR link on original PR
      if: steps.changes.outputs.has_changes == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ github.token }}
        script: |
          const fixPrUrl = '${{ steps.create_pr.outputs.pr_url }}';
          const body = `## 🤖 Claude AutoFix

          A new PR has been created with automated fixes for the failing tests detected in this PR.

          🔗 **Fix PR**: ${fixPrUrl}

          The fixes were generated by Claude AI based on the test failure analysis.
          Please review the changes carefully before merging.`;

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body,
          });
          core.info('Fix PR link posted to original PR.');

    - name: Execution summary
      id: summary
      if: always()
      shell: bash
      run: |
        FIXES=0
        if [ -f "claude-patches/summary.json" ]; then
          FIXES=$(python3 -c "import json; d=json.load(open('claude-patches/summary.json')); print(d.get('successful', 0))")
        fi
        echo "fixes_applied=${FIXES}" >> $GITHUB_OUTPUT
        echo "### Claude AutoFix" >> $GITHUB_STEP_SUMMARY
        echo "- Failing tests: ${{ steps.check.outputs.failures }}" >> $GITHUB_STEP_SUMMARY
        echo "- Fixes applied: ${FIXES}" >> $GITHUB_STEP_SUMMARY
        if [ -n "${{ steps.create_pr.outputs.pr_url }}" ]; then
          echo "- Fix PR: ${{ steps.create_pr.outputs.pr_url }}" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload patches as artifact
      if: always()
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: claude-patches
        path: claude-patches/
        retention-days: 7
        if-no-files-found: ignore
